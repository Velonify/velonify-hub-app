name: Mandanten-Hub veröffentlichen

# Builds the Velonify Hub in tenant mode (whitelisted Google accounts, own database per tenant) and publishes it on
# GitHub Pages under app.velonify.de. Run it by hand after hub changes that tenants should get.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, Tag oder Commit von Velonify/velonify-crm (leer = Repo-Variable HUB_REF, sonst main)
        default: ''
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Velonify/velonify-crm
          ref: ${{ inputs.ref || vars.HUB_REF || 'main' }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_MANDANTEN: '1'
          VITE_GOOGLE_CLIENT_ID: ${{ vars.MANDANTEN_CLIENT_ID }}
          VITE_CRM_API_URL: ${{ vars.CRM_API_URL }}
      - run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
